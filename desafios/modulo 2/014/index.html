<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 005</title>
    <style>
        body {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        thead,
        tbody tr td,
        th {
            border: 1.5px solid black;
            padding: 10px;
        }

        .dest01 {
            background-color: #7B7E7B;
            color: white;
        }

        .textleft {
            text-align: left;
        }

        #num {
            text-align: center;
        }
    </style>
</head>

<body>


    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2" class="dest01">Área</th>
                <th scope="col" rowspan="2" class="dest01">Disciplinas</th>
                <th scope="colgroup" colspan="2" class="dest01">Notas</th>
                <th scope="col" rowspan="2" class="dest01">Média</th>
            </tr>
            <tr>
                <th scope="col" class="dest01">Nota 1</th>
                <th scope="col" class="dest01">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4" class="dest01 textleft">Média de Exatas</th>
                <td class="dest01" id="num">0.0</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3">Humanas</th>
            </tr>
            <tr>
                <td>História</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
                <td id="num">0.0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4" class="dest01 textleft">Média de Humanas</th>
                <td class="dest01" id="num">0.0</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
